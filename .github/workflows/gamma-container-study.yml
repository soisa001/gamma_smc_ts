name: Gamma-SMC container stride study

on:
  workflow_dispatch:
    inputs:
      neutral_replicates:
        description: Number of matched neutral decodes
        required: true
        default: "1"
      output_at_stride:
        description: Posterior output stride in bp
        required: true
        default: "10000"
      workers:
        description: Concurrent neutral simulation/decode workers
        required: true
        default: "4"

jobs:
  decode:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      NEUTRAL_REPLICATES: ${{ inputs.neutral_replicates || '1' }}
      OUTPUT_AT_STRIDE: ${{ inputs.output_at_stride || '10000' }}
      NULL_WORKERS: ${{ inputs.workers || '4' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install locked simulation environment
        run: bash scripts/bootstrap_uv.sh --simulation-only --skip-tests
      - name: Record runner and container
        run: |
          RESULT="sim_results/gamma_smc_container_stride${OUTPUT_AT_STRIDE}"
          mkdir -p "$RESULT"
          lscpu > "$RESULT/run_environment.txt"
          docker pull docker.io/regevsch/gamma_smc:v0.2
          docker image inspect docker.io/regevsch/gamma_smc:v0.2 \
            >> "$RESULT/run_environment.txt"
      - name: Decode selected pseudo-data and neutral simulations
        run: |
          RESULT="sim_results/gamma_smc_container_stride${OUTPUT_AT_STRIDE}"
          scripts/aou.sh run-container-study \
            --source-dir sim_results/two_epoch_growth_s0p05_n2000 \
            --output-dir "$RESULT" \
            --neutral-replicates "$NEUTRAL_REPLICATES" \
            --output-at-stride "$OUTPUT_AT_STRIDE" \
            --workers "$NULL_WORKERS" \
            --runtime docker
      - name: Upload profiles, plots, metrics, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma-smc-stride-${{ env.OUTPUT_AT_STRIDE }}-null-${{ env.NEUTRAL_REPLICATES }}
          path: sim_results/gamma_smc_container_stride*
          if-no-files-found: error
          retention-days: 14
