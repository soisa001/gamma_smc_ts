name: Decoder benchmark

# Measures this branch against the AOU_run baseline on an identical workload,
# then measures thread scaling and pair throughput on this branch alone.
# Manual, because it simulates a panel and takes a few minutes.
#
# workflow_dispatch only works once this file is on the default branch, so the
# development branch also triggers on edits to the workflow itself.
on:
  workflow_dispatch:
    inputs:
      diploids:
        description: Diploid samples to simulate
        required: true
        default: "4000"
      length:
        description: Sequence length in bp
        required: true
        default: "5000000"
      random_pairs:
        description: Pairs for the throughput run (this branch only)
        required: true
        default: "20000"
  push:
    branches: [AOU_run_opt]
    paths:
      - .github/workflows/decoder-benchmark.yml

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: opt

      - uses: actions/checkout@v4
        with:
          ref: AOU_run
          path: base

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libboost-all-dev libhts-dev libzstd-dev

      - name: Build both decoders
        run: |
          make -C opt MARCH=x86-64-v3 bin/gamma_smc
          make -C base MARCH=x86-64-v3 bin/gamma_smc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install simulation dependencies
        run: python -m pip install --quiet msprime tskit numpy pandas

      - name: Simulate the panel
        run: |
          python - <<'PY'
          import msprime, os
          n = int(os.environ["DIPLOIDS"]); length = int(os.environ["LENGTH"])
          ancestry = msprime.sim_ancestry(
              samples=[msprime.SampleSet(n, ploidy=2)],
              population_size=10_000, sequence_length=length,
              recombination_rate=1e-8, model=msprime.StandardCoalescent(),
              random_seed=42,
          )
          ts = msprime.sim_mutations(
              ancestry, rate=1.25e-8, model=msprime.BinaryMutationModel(), random_seed=43
          )
          ts.dump("panel.trees")
          print(f"{ts.num_individuals} diploids, {ts.num_sites} sites, {int(ts.sequence_length)} bp")
          PY
        env:
          DIPLOIDS: ${{ inputs.diploids || '4000' }}
          LENGTH: ${{ inputs.length || '5000000' }}

      - name: Baseline (AOU_run), one thread
        run: |
          /usr/bin/time -v base/bin/gamma_smc \
            --input panel.trees --input_format trees --only_within \
            --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8 \
            --unscaled_mutation_rate 1.25e-8 \
            --recent_threshold_years 4500 --generation_time 25 \
            --recent_summary base.tsv \
            --output_at_hets=false --output_at_stride 1000 \
            > base.log 2> base.time; tail -20 base.log
          grep -E "Elapsed|Maximum resident" base.time

      - name: "Ablation: CPU/memory work only (exact gamma_p, upstream numerics)"
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \n            --input panel.trees --input_format trees --only_within             --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8             --unscaled_mutation_rate 1.25e-8             --recent_threshold_years 4500 --generation_time 25             --recent_summary exact.tsv \n            --output_at_hets=false --output_at_stride 1000 \n            --backward_alignment legacy --exp10 fast \n            --exact_recent_stats \n            --threads 1 \n            > exact.log 2> exact.time; tail -20 exact.log
          grep -E "Elapsed|Maximum resident" exact.time

      - name: "Ablation: plus lookup tables (upstream numerics)"
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \n            --input panel.trees --input_format trees --only_within             --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8             --unscaled_mutation_rate 1.25e-8             --recent_threshold_years 4500 --generation_time 25             --recent_summary legacy.tsv \n            --output_at_hets=false --output_at_stride 1000 \n            --backward_alignment legacy --exp10 fast \n            --threads 1 \n            > legacy.log 2> legacy.time; tail -20 legacy.log
          grep -E "Elapsed|Maximum resident" legacy.time

      - name: "Ablation: plus threads (upstream numerics)"
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \n            --input panel.trees --input_format trees --only_within             --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8             --unscaled_mutation_rate 1.25e-8             --recent_threshold_years 4500 --generation_time 25             --recent_summary optN.tsv \n            --output_at_hets=false --output_at_stride 1000 \n            --backward_alignment legacy --exp10 fast \n            --threads 0 \n            > optN.log 2> optN.time; tail -20 optN.log
          grep -E "Elapsed|Maximum resident" optN.time

      - name: "Shipping defaults: corrected exp10 and backward alignment"
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \n            --input panel.trees --input_format trees --only_within             --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8             --unscaled_mutation_rate 1.25e-8             --recent_threshold_years 4500 --generation_time 25             --recent_summary fixed.tsv \n            --output_at_hets=false --output_at_stride 1000 \n            --threads 0 \n            > fixed.log 2> fixed.time; tail -20 fixed.log
          grep -E "Elapsed|Maximum resident" fixed.time

      - name: Throughput at scale, two thresholds plus bit matrix
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \
            --input panel.trees --input_format trees \
            --n_random_pairs ${{ inputs.random_pairs || '20000' }} --pairs_seed 1729 \
            --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8 \
            --unscaled_mutation_rate 1.25e-8 \
            --recent_threshold_years 4500,10000 --generation_time 25 \
            --recent_summary scale.tsv --recent_bitmatrix scale.bits \
            --output_at_hets=false --output_at_stride 1000 --threads 0 \
            > scale.log 2> scale.time; tail -25 scale.log
          grep -E "Elapsed|Maximum resident" scale.time
          ls -l scale.bits

      - name: Compare and project
        run: >-
          python opt/scripts/compare_benchmark.py
          --length ${{ inputs.length || '5000000' }}
          --random-pairs ${{ inputs.random_pairs || '20000' }}
          --pairs ${{ inputs.diploids || '4000' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-outputs
          path: |
            *.tsv
            *.time
            *.log
          if-no-files-found: ignore
