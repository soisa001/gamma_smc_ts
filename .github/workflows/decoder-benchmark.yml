name: Decoder benchmark

# Measures this branch against the AOU_run baseline on an identical workload,
# then measures thread scaling and pair throughput on this branch alone.
# Manual, because it simulates a panel and takes a few minutes.
#
# workflow_dispatch only works once this file is on the default branch, so the
# development branch also triggers on edits to the workflow itself.
on:
  workflow_dispatch:
    inputs:
      diploids:
        description: Diploid samples to simulate
        required: true
        default: "1000"
      length:
        description: Sequence length in bp
        required: true
        default: "10000000"
      random_pairs:
        description: Pairs for the throughput run (this branch only)
        required: true
        default: "20000"
  push:
    branches: [AOU_run_opt]
    paths:
      - .github/workflows/decoder-benchmark.yml

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: opt

      - uses: actions/checkout@v4
        with:
          ref: AOU_run
          path: base

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libboost-all-dev libhts-dev libzstd-dev

      - name: Build both decoders
        run: |
          make -C opt MARCH=x86-64-v3 bin/gamma_smc
          make -C base MARCH=x86-64-v3 bin/gamma_smc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install simulation dependencies
        run: python -m pip install --quiet msprime tskit numpy pandas

      - name: Simulate the panel
        run: |
          python - <<'PY'
          import msprime, os
          n = int(os.environ["DIPLOIDS"]); length = int(os.environ["LENGTH"])
          ancestry = msprime.sim_ancestry(
              samples=[msprime.SampleSet(n, ploidy=2)],
              population_size=10_000, sequence_length=length,
              recombination_rate=1e-8, model=msprime.StandardCoalescent(),
              random_seed=42,
          )
          ts = msprime.sim_mutations(
              ancestry, rate=1.25e-8, model=msprime.BinaryMutationModel(), random_seed=43
          )
          ts.dump("panel.trees")
          print(f"{ts.num_individuals} diploids, {ts.num_sites} sites, {int(ts.sequence_length)} bp")
          PY
        env:
          DIPLOIDS: ${{ inputs.diploids || '1000' }}
          LENGTH: ${{ inputs.length || '10000000' }}

      - name: Baseline (AOU_run), one thread
        run: |
          /usr/bin/time -v base/bin/gamma_smc \
            --input panel.trees --input_format trees --only_within \
            --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8 \
            --unscaled_mutation_rate 1.25e-8 \
            --recent_threshold_years 4500 --generation_time 25 \
            --recent_summary base.tsv \
            --output_at_hets=false --output_at_stride 1000 \
            2> base.time | tail -20
          grep -E "Elapsed|Maximum resident" base.time

      - name: This branch, one thread, identical workload
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \
            --input panel.trees --input_format trees --only_within \
            --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8 \
            --unscaled_mutation_rate 1.25e-8 \
            --recent_threshold_years 4500 --generation_time 25 \
            --recent_summary opt1.tsv \
            --output_at_hets=false --output_at_stride 1000 --threads 1 \
            2> opt1.time | tail -20
          grep -E "Elapsed|Maximum resident" opt1.time

      - name: This branch, all threads
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \
            --input panel.trees --input_format trees --only_within \
            --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8 \
            --unscaled_mutation_rate 1.25e-8 \
            --recent_threshold_years 4500 --generation_time 25 \
            --recent_summary optN.tsv \
            --output_at_hets=false --output_at_stride 1000 --threads 0 \
            2> optN.time | tail -20
          grep -E "Elapsed|Maximum resident" optN.time

      - name: Throughput at scale, two thresholds plus bit matrix
        run: |
          /usr/bin/time -v opt/bin/gamma_smc \
            --input panel.trees --input_format trees \
            --n_random_pairs ${{ inputs.random_pairs || '20000' }} --pairs_seed 1729 \
            --scaled_mutation_rate 0.0005 --recombination_to_mutation_ratio 0.8 \
            --unscaled_mutation_rate 1.25e-8 \
            --recent_threshold_years 4500,10000 --generation_time 25 \
            --recent_summary scale.tsv --recent_bitmatrix scale.bits \
            --output_at_hets=false --output_at_stride 1000 --threads 0 \
            2> scale.time | tail -25
          grep -E "Elapsed|Maximum resident" scale.time
          ls -l scale.bits

      - name: Compare and project
        run: |
          python - <<'PY'
          import pandas as pd, numpy as np, re, os, pathlib

          def elapsed(path):
              text = pathlib.Path(path).read_text()
              m = re.search(r"Elapsed \(wall clock\) time.*?:\s*([\d:.]+)", text)
              parts = [float(p) for p in m.group(1).split(":")]
              seconds = 0.0
              for p in parts:
                  seconds = seconds * 60 + p
              rss = float(re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", text).group(1))
              return seconds, rss / 1048576.0

          rows = {name: elapsed(f"{name}.time") for name in ("base", "opt1", "optN", "scale")}
          for name, (secs, gb) in rows.items():
              print(f"{name:6} {secs:8.1f} s   peak RSS {gb:6.2f} GB")

          base_s = rows["base"][0]; opt1_s = rows["opt1"][0]; optN_s = rows["optN"][0]
          print(f"\nsingle-thread speedup vs AOU_run: {base_s / opt1_s:.2f}x")
          print(f"thread scaling on {os.cpu_count()} vCPU:  {opt1_s / optN_s:.2f}x")
          print(f"total speedup:                    {base_s / optN_s:.2f}x")

          # Same statistic must come out of both binaries.
          base = pd.read_csv("base.tsv", sep="\t")
          opt = pd.read_csv("opt1.tsv", sep="\t")
          assert len(base) == len(opt), (len(base), len(opt))
          delta = np.abs(base["mean_p_tmrca_lt_threshold"] - opt["mean_p_tmrca_lt_threshold"])
          print(f"\nmean_p_tmrca_lt_threshold vs baseline: max |delta| = {np.nanmax(delta):.3e}")
          dt = np.abs(base["mean_tmrca_generations"] - opt["mean_tmrca_generations"])
          rel = dt / np.maximum(np.abs(base["mean_tmrca_generations"]), 1e-12)
          print(f"mean_tmrca_generations:                max rel = {np.nanmax(rel):.3e}")

          # Project the whole-genome cost from the throughput run.
          length = int(os.environ["LENGTH"]); pairs = int(os.environ["RANDOM_PAIRS"])
          scale_s = rows["scale"][0]
          per = scale_s / (pairs * length / 1e9)
          print(f"\nthroughput: {per:.1f} s per (Gbp x pair) of wall time on {os.cpu_count()} vCPU")
          print(f"projected 3.1 Gbp x 100,000 pairs here: {per * 3.1 * 1e5 / 3600:.1f} h")
          print(f"same work scaled to 32 cores:           {per * 3.1 * 1e5 / 3600 * os.cpu_count() / 32:.1f} h")
          PY
        env:
          LENGTH: ${{ inputs.length || '10000000' }}
          RANDOM_PAIRS: ${{ inputs.random_pairs || '20000' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-outputs
          path: |
            *.tsv
            *.time
          if-no-files-found: ignore
