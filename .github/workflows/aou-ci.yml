name: AoU workflow CI

on:
  push:
  pull_request:

jobs:
  linux-build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Bootstrap, build, and test locked environment
        run: bash scripts/bootstrap_uv.sh
