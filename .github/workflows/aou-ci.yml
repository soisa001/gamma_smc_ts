name: AoU workflow CI

on:
  push:
  pull_request:

jobs:
  linux-build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev libhts-dev libzstd-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e '.[test,tszip]'
      - name: Build Gamma-SMC
        run: make MARCH=x86-64
      - name: Run Python and C++ integration tests
        env:
          GAMMA_SMC_BIN: ${{ github.workspace }}/bin/gamma_smc
        run: pytest -q
