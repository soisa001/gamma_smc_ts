name: C++ decoder build

# Fast feedback on the decoder itself: apt packages and one make, without the
# full locked-environment bootstrap. Runs a smoke decode so a binary that
# compiles but immediately dies still fails the job.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libboost-all-dev libhts-dev libzstd-dev

      - name: Build
        run: make MARCH=x86-64-v3 bin/gamma_smc

      - name: Build without OpenMP
        run: make clean && make OPENMP=0 MARCH=x86-64-v3 bin/gamma_smc && make clean

      - name: Rebuild with OpenMP
        run: make MARCH=x86-64-v3 bin/gamma_smc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --quiet numpy pandas scipy zstandard pytest msprime tskit tszip matplotlib

      - name: Decoder tests
        env:
          GAMMA_SMC_BIN: ${{ github.workspace }}/bin/gamma_smc
          PYTHONPATH: ${{ github.workspace }}/python:${{ github.workspace }}/tests
        run: |
          python -m pytest tests/test_bitmatrix.py tests/test_source_regressions.py -q
          python -m pytest tests/test_cpp_integration.py tests/test_cpp_bitmatrix_integration.py tests/test_cpp_sample_subset.py -q -s

      - name: Upload binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamma_smc
          path: bin/gamma_smc
          if-no-files-found: ignore
