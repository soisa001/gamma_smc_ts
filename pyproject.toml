[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-smc-aou"
version = "0.1.0"
description = "Within-individual Gamma-SMC selection scan and neutral calibration"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "msprime>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "tskit>=0.5",
]

[project.optional-dependencies]
tszip = ["tszip>=0.2"]
test = ["pytest>=8"]

[project.scripts]
gamma-smc-aou = "gamma_smc_aou.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
